name: Train symbol relations
on:
  workflow_dispatch:
  push:
    tags: ['train-relations-*']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERAS_BACKEND: tensorflow
      TF_NUM_INTRAOP_THREADS: '3'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python train_relations.py
      - uses: actions/upload-artifact@v4
        with:
          name: trained-symbol-relations
          path: |
            results/symbol_relations.weights.h5
            results/symbol_relations_metrics.json
          if-no-files-found: error
