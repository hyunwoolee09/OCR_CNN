name: Compare synthetic relation training
on:
  workflow_dispatch:
  push:
    tags: ['compare-synthetic-*']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [pairs, context]
    env:
      TF_NUM_INTRAOP_THREADS: '3'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python train_relations.py --synthetic ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.mode }}
          path: |
            results/symbol_relations_${{ matrix.mode }}.weights.h5
            results/symbol_relations_${{ matrix.mode }}_metrics.json
          if-no-files-found: error
